name: Build Test

on:
  workflow_dispatch:
    inputs:
      BASE_IMAGE_NAMESPACE:
        description: 'Base image namespace (Default: Your Github username)'
        required: false
        default: ''
      DOCKERHUB_IMAGE_NAMESPACE:
        description: 'Docker Hub image namespace (Default: Your Github username)'
        required: false
        default: ''
      GHCR_IMAGE_NAMESPACE:
        description: 'GitHub Container Registry image namespace (Default: Your Github username)'
        required: false
        default: ''
      SKIP_DOCKER_HUB:
        description: 'Set to true to skip pushing to Docker Hub (default: false)'
        required: false
        default: 'false'
      SKIP_GHCR:
        description: 'Set to true to skip pushing to GHCR (default: false)'
        required: false
        default: 'false'
      WEBCLIENT_SOURCE_LOCATION:
        description: 'Web Client API Repository'
        required: true
        default: 'https://github.com/Alien21/rustdesk-api-web'

env:
  LATEST_TAG: latest
  WEBCLIENT_SOURCE_LOCATION: ${{ github.event.inputs.WEBCLIENT_SOURCE_LOCATION || 'https://github.com/Alien21/rustdesk-api-web' }}
  BASE_IMAGE_NAMESPACE: ${{ github.event.inputs.BASE_IMAGE_NAMESPACE || github.actor }}
  DOCKERHUB_IMAGE_NAMESPACE: ${{ github.event.inputs.DOCKERHUB_IMAGE_NAMESPACE || github.actor }}
  GHCR_IMAGE_NAMESPACE: ${{ github.event.inputs.GHCR_IMAGE_NAMESPACE || github.actor }}
  SKIP_DOCKER_HUB: ${{ github.event.inputs.SKIP_DOCKER_HUB || 'false' }}
  SKIP_GHCR: ${{ github.event.inputs.SKIP_GHCR || 'false' }}
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Alien21/rustdesk-api-web
          path: artifacts/build/frontend
          ref: develop-alien21

      - name: Set up Go environment
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'  # 选择 Go 版本
          cache: false

      - name: Set up npm
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: build rustdesk-api-web
        working-directory: artifacts/build/frontend
        run: |
          npm_config_cache="$GITHUB_WORKSPACE/artifacts/cache/npm" npm install
          npm run build -- --outDir ../../publish/web

      - name: Stage sources and build caches
        run: |
          mkdir -p artifacts/build/source artifacts/cache/go-build artifacts/cache/go-mod artifacts/cache/bin artifacts/tmp
          tar --exclude=./artifacts --exclude=./.git -cf - . | tar -xf - -C artifacts/build/source
          echo "GOCACHE=$GITHUB_WORKSPACE/artifacts/cache/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$GITHUB_WORKSPACE/artifacts/cache/go-mod" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$GITHUB_WORKSPACE/artifacts/tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$GITHUB_WORKSPACE/artifacts/tmp" >> "$GITHUB_ENV"
          echo "GOBIN=$GITHUB_WORKSPACE/artifacts/cache/bin" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/artifacts/cache/bin" >> "$GITHUB_PATH"

      - name: tidy
        working-directory: artifacts/build/source
        run: go mod tidy

      - name: swag
        working-directory: artifacts/build/source
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api

      - name: Build for ${{ matrix.job.goos }}-${{ matrix.job.platform }}
        working-directory: artifacts/build/source
        run: |
          RELEASE="$GITHUB_WORKSPACE/artifacts/build/release"
          mkdir -p "$RELEASE"/{resources/admin,data,runtime} "$GITHUB_WORKSPACE/artifacts/publish"
          cp -ar resources docs conf "$RELEASE/"
          cp -ar "$GITHUB_WORKSPACE/artifacts/publish/web/." "$RELEASE/resources/admin/"
          if [ "${{ matrix.job.goos }}" = "windows" ]; then
            sudo apt-get install gcc-mingw-w64-x86-64 zip -y
            GOOS=${{ matrix.job.goos }} GOARCH=${{ matrix.job.platform }} CC=x86_64-w64-mingw32-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o "$RELEASE/rustdesk-api.exe" ./cmd/apimain.go
            echo @echo off > "$RELEASE/start.bat"
            echo cmd /c \"%~dp0rustdesk-api.exe\" >> "$RELEASE/start.bat"
            (cd "$GITHUB_WORKSPACE/artifacts/build" && zip -r "../publish/${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}" ./release)
          else
            if [ "${{ matrix.job.platform }}" = "arm64" ]; then
                wget -P "$GITHUB_WORKSPACE/artifacts/cache" https://musl.ljw.red/aarch64-linux-musl-cross.tgz
                tar -xf "$GITHUB_WORKSPACE/artifacts/cache/aarch64-linux-musl-cross.tgz" -C "$GITHUB_WORKSPACE/artifacts/cache"
                export PATH="$PATH:$GITHUB_WORKSPACE/artifacts/cache/aarch64-linux-musl-cross/bin"
                GOOS=${{ matrix.job.goos }} GOARCH=${{ matrix.job.platform }} CC=aarch64-linux-musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o "$RELEASE/rustdesk-api" ./cmd/apimain.go
            elif [ "${{ matrix.job.platform }}" = "armv7l" ]; then
                wget -P "$GITHUB_WORKSPACE/artifacts/cache" https://musl.ljw.red/armv7l-linux-musleabihf-cross.tgz
                tar -xf "$GITHUB_WORKSPACE/artifacts/cache/armv7l-linux-musleabihf-cross.tgz" -C "$GITHUB_WORKSPACE/artifacts/cache"
                export PATH="$PATH:$GITHUB_WORKSPACE/artifacts/cache/armv7l-linux-musleabihf-cross/bin"
                GOOS=${{ matrix.job.goos }} GOARCH=arm GOARM=7 CC=armv7l-linux-musleabihf-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o "$RELEASE/rustdesk-api" ./cmd/apimain.go
            else
              sudo apt-get install musl musl-dev musl-tools -y
              GOOS=${{ matrix.job.goos }} GOARCH=${{ matrix.job.platform }} CC=musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o "$RELEASE/rustdesk-api" ./cmd/apimain.go
            fi
            tar -czf "$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}" -C "$GITHUB_WORKSPACE/artifacts/build" ./release
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: |
            artifacts/publish/${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}
          tag_name: test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deb-package:
    name: debian package - ${{ matrix.job.platform }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", debian_platform: "amd64", crossbuild_package: ""}
          - { platform: "arm64", goos: "linux", debian_platform: "arm64", crossbuild_package: "crossbuild-essential-arm64" }
          - { platform: "armv7l", goos: "linux", debian_platform: "armhf", crossbuild_package: "crossbuild-essential-armhf" }
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Create packaging env
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p artifacts/build/debian/${{ matrix.job.platform }}/bin artifacts/publish
          cp -ar debian systemd artifacts/build/debian/${{ matrix.job.platform }}/

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: artifacts/publish

      - name: Unzip binaries
        run: |
          mkdir -p artifacts/build/${{ matrix.job.platform }}
          tar -xzf artifacts/publish/${{ matrix.job.goos }}-${{ matrix.job.platform }}.tar.gz -C artifacts/build/${{ matrix.job.platform }}

      - name: Build package for ${{ matrix.job.platform }} arch
        run: |
          mv artifacts/build/${{ matrix.job.platform }}/release/rustdesk-api artifacts/build/debian/${{ matrix.job.platform }}/bin/rustdesk-api
          chmod -v a+x artifacts/build/debian/${{ matrix.job.platform }}/bin/*
          cp -vr artifacts/build/${{ matrix.job.platform }}/release/{conf,data,resources,runtime} artifacts/build/debian/${{ matrix.job.platform }}/
          cat debian/control.tpl | sed 's/{{ ARCH }}/${{ matrix.job.debian_platform }}/' > artifacts/build/debian/${{ matrix.job.platform }}/debian/control
          cd artifacts/build/debian/${{ matrix.job.platform }}/
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform}}
          cp ../*.deb "$GITHUB_WORKSPACE/artifacts/publish/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-${{ matrix.job.debian_platform }}
          path: |
            artifacts/publish/*.deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: |
            artifacts/publish/rustdesk-api-server_*_${{ matrix.job.debian_platform }}.deb

  docker:
    name: Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux",  docker_platform: "linux/amd64" }
          - { platform: "arm64", goos: "linux",  docker_platform: "linux/arm64" }
          - { platform: "armv7l", goos: "linux",  docker_platform: "linux/arm/v7" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only log in if SKIP_DOCKER_HUB is false
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only log in if GHCR push is enabled
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=test" >> $GITHUB_ENV  # Default to 'test' if not a tag
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: artifacts/publish

      - name: Unzip binaries
        run: |
          mkdir -p artifacts/build/${{ matrix.job.platform }}
          tar -xzf artifacts/publish/${{ matrix.job.goos }}-${{ matrix.job.platform }}.tar.gz -C artifacts/build/${{ matrix.job.platform }}

      - name: Build and push Docker image to Docker Hub ${{ matrix.job.platform }}
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only run this step if SKIP_DOCKER_HUB is false
        uses: docker/build-push-action@v5
        with:
          context: "."
          file: ./Dockerfile
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            BUILDARCH=${{ matrix.job.platform }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-${{ matrix.job.platform }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image to GHCR ${{ matrix.job.platform }}
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only run this step if SKIP_GHCR is false
        uses: docker/build-push-action@v5
        with:
          context: "."
          file: ./Dockerfile
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            BUILDARCH=${{ matrix.job.platform }}
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-${{ matrix.job.platform }}
          labels: ${{ steps.meta.outputs.labels }}

  #
  docker-manifest:
    name: Push Docker Manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=test" >> $GITHUB_ENV  # Default to 'test' if not a tag
          fi

      - name: Log in to Docker Hub
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only log in if Docker Hub push is enabled
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only log in if GHCR push is enabled
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest Docker Hub (:version)
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}
        uses: Noelware/docker-manifest-action@v0.2.3
        with:
          base-image: ${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}
          extra-images: ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-amd64,
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-armv7l,
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-arm64
          push: true

      - name: Create and push manifest GHCR (:version)
        if: ${{ env.SKIP_GHCR == 'false' }}
        uses: Noelware/docker-manifest-action@v0.2.3
        with:
          base-image: ghcr.io/${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}
          extra-images: ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-amd64,
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-armv7l,
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-arm64
          push: true
          amend: true
